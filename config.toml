state_dir = "~/.local/state/qsl-agent"

[provider]
base_url = "http://localhost:11434"
model = "llama3.1:8b"
tier = "medium"
request_timeout_s = 120
max_retries = 3

[agent]
max_steps_per_turn = 16
max_turn_seconds = 300
max_concurrent_tools = 4
tool_timeout_s = 60
system_prompt = "You are QSL, a concise local agent. Use tools when needed."
temperature = 0.2

[tools]
max_output_bytes = 65536
command_timeout_s = 30
allow_shell = true
allowed_paths = ["~"]

[health]
heartbeat_interval_s = 30
stall_threshold_s = 120

[memory]
notes_file = "~/qsl/Memories.md"
bm25_top_k = 8

[cost]
input_usd_per_million = 0.0
output_usd_per_million = 0.0
