name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-15-intel,        target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: macos-15,        target: aarch64-apple-darwin,      ext: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          asset="qsl-agent-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C target/release qsl-agent
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $asset = "qsl-agent-${{ matrix.target }}.zip"
          Compress-Archive -Path target\release\qsl-agent.exe -DestinationPath $asset
          $h = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$h  $asset" | Out-File -Encoding ascii "$asset.sha256"
          "ASSET=$asset" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
