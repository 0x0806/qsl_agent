[package]
name = "qsl_agent"
version = "0.2.0"
edition = "2021"
authors = ["Quantum Secular Labs <https://quantumseclabs.com/>"]
homepage = "https://quantumseclabs.com/"
description = "QSL Agent — Ultra-lightweight, rapid Rust autonomous AI agent for 100% local inference with Ollama, LM Studio, GGUF models, and Obsidian-backed persistent memory (2026)"
license-file = "LICENSE"
repository = "https://github.com/qsl-team/qsl-agent"
keywords = ["ai", "agent", "local", "ollama", "rust"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
rustyline = "14.0"
dirs = "5.0"
chrono = "0.4"
walkdir = "2.5"
toml = "0.8"
regex = "1.10"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
