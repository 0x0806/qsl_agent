[package]
name = "qsl-agent"
version = "0.5.1"
edition = "2021"
rust-version = "1.89"
authors = ["Quantum Secular Labs <https://quantumseclabs.com/>"]
homepage = "https://quantumseclabs.com/"
repository = "https://github.com/0x0806/qsl_agent"
description = "QSL Agent — fast, local-first autonomous AI agent in Rust (Ollama, LM Studio, OpenAI-compatible) with Obsidian memory"
license-file = "LICENSE"
keywords = ["ai", "agent", "local", "ollama", "llm"]
default-run = "qsl-agent"

[[bin]]
name = "qsl-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
colored = "3.1.1"
dirs = "7.0.0"
futures-util = "0.3.34"
libc = "0.2.191"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rustyline = { version = "19.0.0", features = ["signal-hook"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.3"
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
